[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plugin-integrator-cboe"
version = "0.3.0"  # the plugin's own release (CHANGELOG.md); the app shows it on the Plugins view
description = "Cboe for Liminal: daily history of Cboe's indices (VIX from 1990) and of VIX futures (from 2004), no key."
readme = "README.md"
requires-python = ">=3.10"
# the library it plugs into (the class contract, plugin API 2.0: liminal-libs 1.3.0); which of its releases
# can load it is the plugin API the plugin declares (each feed's api, checked when the app loads it), not this line
dependencies = ["liminal-libs>=1.49.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.entry-points."liminal.providers"]
cboe = "plugin_integrator_cboe"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
